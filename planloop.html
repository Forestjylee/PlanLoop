<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlanLoop · 时间块执行台</title>
<style>
:root{
  --bg:#f5f5f7; --bg-grad:#f0f0f2; --card:#ffffff; --card2:#f2f2f5; --ink:#1d1d1f; --muted:#86868b;
  --line:#d3d3d8; --line-soft:rgba(0,0,0,.055);
  --accent:#0071e3; --accent-2:#0a84ff; --accent-soft:rgba(0,113,227,.10);
  --ok:#1e9b4f; --ok-soft:rgba(30,155,79,.11); --warn:#c47f17; --warn-soft:rgba(196,127,23,.13);
  --skip:#86868b; --skip-soft:rgba(134,134,139,.13); --danger:#ff3b30; --danger-soft:rgba(255,59,48,.11);
  --band:rgba(0,0,0,.028); --ring:rgba(0,113,227,.28);
  --shadow-sm:0 1px 2px rgba(0,0,0,.03);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.02),0 14px 30px -12px rgba(0,0,0,.12);
  --shadow-lg:0 2px 10px rgba(0,0,0,.05),0 32px 64px -22px rgba(0,0,0,.24);
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:22px;
  --ease:cubic-bezier(.32,.72,.35,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
}
[data-theme="dark"]{
  --bg:#000; --bg-grad:#0b0b0d; --card:#1c1c1e; --card2:#2c2c2e; --ink:#f5f5f7; --muted:#a1a1a6;
  --line:#3a3a3d; --line-soft:rgba(255,255,255,.08);
  --accent:#0a84ff; --accent-2:#409cff; --accent-soft:rgba(10,132,255,.16);
  --ok:#30d158; --ok-soft:rgba(48,209,88,.14); --warn:#ff9f0a; --warn-soft:rgba(255,159,10,.16);
  --skip:#8e8e93; --skip-soft:rgba(142,142,147,.18); --danger:#ff453a; --danger-soft:rgba(255,69,58,.16);
  --band:rgba(255,255,255,.035); --ring:rgba(10,132,255,.4);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 36px -14px rgba(0,0,0,.5);
  --shadow-lg:0 2px 10px rgba(0,0,0,.5),0 38px 76px -26px rgba(0,0,0,.72);
}
/* ---- 主题色 palettes（5 套，浅/深；仅调 accent 系，底为中性苹果灰）---- */
body[data-palette="amber"]{--accent:#b7791f;--accent-2:#9a6512;--accent-soft:rgba(183,121,31,.13);--ring:rgba(183,121,31,.3)}
body[data-palette="jade"]{--accent:#0f8a5f;--accent-2:#0b6e4b;--accent-soft:rgba(15,138,95,.13);--ring:rgba(15,138,95,.3)}
body[data-palette="violet"]{--accent:#7a5af8;--accent-2:#6241e6;--accent-soft:rgba(122,90,248,.14);--ring:rgba(122,90,248,.3)}
body[data-palette="onyx"]{--accent:#46607e;--accent-2:#364c68;--accent-soft:rgba(70,96,126,.14);--ring:rgba(70,96,126,.3)}
body[data-theme="dark"][data-palette="amber"]{--accent:#e6a24d;--accent-2:#f0bd78;--accent-soft:rgba(230,162,77,.18)}
body[data-theme="dark"][data-palette="jade"]{--accent:#2fbd85;--accent-2:#5ccfa1;--accent-soft:rgba(47,189,133,.18)}
body[data-theme="dark"][data-palette="violet"]{--accent:#9a7dff;--accent-2:#b79cff;--accent-soft:rgba(154,125,255,.2)}
body[data-theme="dark"][data-palette="onyx"]{--accent:#8fa0bc;--accent-2:#b3c0d8;--accent-soft:rgba(143,160,188,.2)}
/* 调色板选择器（顶栏 ◈ 弹出） */
#paletteWrap{position:relative;display:inline-flex}
.palette{position:fixed;z-index:120;display:flex;align-items:center;gap:9px;padding:12px 13px;border:1px solid var(--line-soft);border-radius:var(--r-md);background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:var(--shadow-lg);opacity:0;transform:translateY(-7px) scale(.97);pointer-events:none;transition:opacity .18s var(--ease),transform .18s var(--ease)}
.palette.open{opacity:1;transform:none;pointer-events:auto}
.ptitle{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);margin-right:2px;user-select:none}
.pdot{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);cursor:pointer;background:var(--c);box-shadow:0 1px 5px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.14);transition:transform .16s var(--ease),box-shadow .16s var(--ease)}
.pdot:hover{transform:scale(1.18)}
.pdot.on{box-shadow:0 0 0 2px var(--card),0 0 0 4.5px var(--c)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(1200px 620px at 50% -18%,var(--bg-grad),transparent 62%),radial-gradient(900px 480px at 96% 2%,color-mix(in srgb,var(--accent) 4.5%,transparent),transparent 55%);
  background-attachment:fixed;
  color:var(--ink);font:15px/1.6 var(--font);letter-spacing:.1px;
  transition:background .4s linear,color .4s linear;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--muted-2,var(--line));border-radius:99px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:padding-box}
:root{--muted-2:#aeaeb2}[data-theme="dark"]{--muted-2:#636366}

.app{display:flex;flex-direction:column;min-height:100vh;max-width:960px;margin:0 auto;padding:0 20px 48px}

/* ---------- Top bar (Apple glass) ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:16px 2px;margin:0 -2px;flex-wrap:wrap;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);mask-image:linear-gradient(to bottom,#000 84%,transparent)}
.logo{font-weight:800;letter-spacing:.2px;font-size:17px;display:flex;align-items:center;gap:9px}
.logo .dot{width:14px;height:14px;border-radius:4.5px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 2px 8px var(--ring)}
.nav{margin-left:auto;display:flex;gap:2px;background:color-mix(in srgb,var(--card2) 85%,transparent);padding:3px;border-radius:999px;flex-wrap:wrap;border:1px solid var(--line-soft)}
.nav button{padding:7px 15px;border-radius:999px;color:var(--muted);font-weight:600;font-size:13.5px;background:none;border:none;transition:color .2s var(--ease),background .2s var(--ease),box-shadow .25s var(--ease)}
.nav button:hover{color:var(--ink)}
.nav button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm)}
.iconbtn{width:38px;height:38px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--muted);background:color-mix(in srgb,var(--card) 65%,transparent);border:1px solid var(--line-soft);font-size:15px;backdrop-filter:saturate(140%) blur(10px);-webkit-backdrop-filter:saturate(140%) blur(10px);transition:color .2s var(--ease),border-color .2s var(--ease),transform .18s var(--ease)}
.iconbtn:hover{color:var(--ink);transform:translateY(-1px)}
.datenav{display:flex;align-items:center;gap:6px}
.datebtn{width:36px;height:36px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--card);border:1px solid var(--line-soft);color:var(--muted);font-size:15px;transition:.2s var(--ease)}
.datebtn:hover{color:var(--ink);transform:translateY(-1px)}
.datelabel{min-width:132px;text-align:center;font-weight:650;letter-spacing:.2px}
.datelabel.flex{flex:1}
.todaybtn{height:36px;padding:0 15px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:650;font-size:13px;transition:.2s var(--ease)}
.todaybtn:hover{filter:brightness(.965)}

/* ---------- Views ---------- */
.view{display:none;padding-bottom:28px}
.view.on{display:block;animation:fadeUp .42s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Day view ---------- */
.dayhead{display:flex;align-items:baseline;gap:10px;margin:12px 0 18px;flex-wrap:wrap}
.dayhead h2{font-size:25px;font-weight:800;letter-spacing:-.025em}
.dayhead .sub{color:var(--muted);font-size:13.5px}
.emptyhint{color:var(--muted);text-align:center;padding:36px 0;font-size:13.5px}

.timeline{position:relative;border-radius:var(--r-xl);background-image:repeating-linear-gradient(to bottom,var(--band) 0,var(--band) 43.2px,transparent 43.2px,transparent 86.4px)}
.gutter{position:absolute;left:0;top:0;bottom:0;width:46px}
.gutter .gh{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line-soft);opacity:.9}
.gutter .gl{position:absolute;right:7px;transform:translateY(-50%);font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.3px}
.nowln{position:absolute;left:0;right:0;height:0;border-top:1.6px solid var(--danger);z-index:2;pointer-events:none;opacity:.95;box-shadow:0 0 0 1px var(--danger-soft);animation:nowPulse 2.6s ease-in-out infinite}
.nowln::before{content:"";position:absolute;left:0;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
@keyframes nowPulse{0%,100%{opacity:.55}50%{opacity:1}}
#timeline .block{position:absolute;left:49px;right:4px;box-sizing:border-box;background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .22s var(--ease),border-color .22s var(--ease),transform .16s var(--ease);animation:blockIn .4s var(--ease) both;will-change:top,transform;transform-origin:top left}
#timeline.no-anim .block{animation:none}
#timeline .block:hover{border-color:color-mix(in srgb,var(--accent) 34%,var(--line-soft));box-shadow:var(--shadow-lg)}
#timeline .block .bar{position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:var(--r-md) 0 0 var(--r-md);opacity:.96}
#timeline .block .ttime{font-size:10.5px;color:var(--muted);font-weight:650;font-variant-numeric:tabular-nums;margin-left:9px;opacity:.82;letter-spacing:.2px}
/* 时段分区：上午 / 下午 / 晚上 */
#timeline .zone{position:absolute;left:46px;right:4px;border-radius:var(--r-md);pointer-events:none;overflow:hidden}
#timeline .zone .zn{position:absolute;left:11px;top:6px;font-size:10px;font-weight:800;letter-spacing:3px;color:var(--muted);opacity:.6}
#timeline .zone.z-am{background:color-mix(in srgb,var(--accent) 4.5%,transparent)}
#timeline .zone.z-am .zn{color:var(--accent);opacity:.75}
#timeline .zone.z-pm{background:color-mix(in srgb,#c47f17 3.5%,transparent);border-top:1px dashed color-mix(in srgb,#c47f17 30%,transparent)}
#timeline .zone.z-pm .zn{color:#a8792a}
#timeline .zone.z-eve{background:color-mix(in srgb,#7a5af8 4.5%,transparent);border-top:1px dashed color-mix(in srgb,#7a5af8 30%,transparent)}
#timeline .zone.z-eve .zn{color:#7a5af8}
@keyframes blockIn{from{opacity:0;transform:translateY(7px) scale(.985)}to{opacity:1;transform:none}}
@keyframes dragLift{from{transform:scale(1) rotate(0)}to{transform:scale(1.035) rotate(.4deg)}}
#timeline .block.dragging{box-shadow:0 24px 48px -14px color-mix(in srgb,var(--accent) 45%,transparent),var(--shadow-lg);cursor:grabbing;border-color:var(--accent);z-index:25;transform:scale(1.035) rotate(.4deg);transition:none;animation:dragLift .16s var(--ease)}
#timeline .block.dragging::after{content:var(--t,"");position:absolute;right:12px;top:-12px;transform:translateY(-50%);background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums;z-index:3;letter-spacing:.3px;box-shadow:var(--shadow-sm)}
#timeline .block.drag-hit{animation:hitPulse .55s ease-in-out infinite}
@keyframes hitPulse{0%,100%{box-shadow:0 0 0 3px var(--warn-soft),var(--shadow)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--warn) 36%,transparent);border-color:var(--warn)}}
#timeline .block.clash{border-color:color-mix(in srgb,var(--warn) 72%,var(--line-soft));box-shadow:0 0 0 3px var(--warn-soft),var(--shadow)}
.clashtip{position:absolute;left:10px;right:10px;bottom:8px;z-index:6;background:linear-gradient(135deg,var(--warn),color-mix(in srgb,var(--warn) 70%,#000));color:#fff;font-size:11px;font-weight:750;padding:6px 9px;border-radius:var(--r-sm);box-shadow:0 8px 18px color-mix(in srgb,var(--warn) 42%,transparent);animation:tipIn .16s var(--ease)}
@keyframes tipIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.clashblog{display:inline-flex;align-items:center;gap:5px;color:var(--warn);font-weight:750;animation:chime .45s var(--ease)}
.clashblog .s{width:7px;height:7px;border-radius:2px;background:var(--warn)}
@keyframes chime{from{opacity:0;transform:scale(.7)}60%{transform:scale(1.12)}to{opacity:1;transform:scale(1)}}
#timeline .block.open{height:auto;min-height:inherit;z-index:5;box-shadow:var(--shadow-lg)}
#timeline .block .head{cursor:grab}
#timeline .block.dragging .head{cursor:grabbing}
#timeline .block .grip{flex:0 0 auto;width:9px;height:15px;margin:1px 7px 0 0;opacity:.4;background-image:radial-gradient(circle,color-mix(in srgb,var(--muted) 85%,transparent) 1.4px,transparent 1.6px);background-size:4px 5px;transition:opacity .18s var(--ease)}
#timeline .block:hover .grip{opacity:.96}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(154px,1fr));gap:12px;margin-bottom:20px}
.preset{display:block;text-align:left;padding:14px 15px;border-radius:var(--r-lg);border:1px solid var(--line-soft);background:var(--card);box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .22s var(--ease),transform .2s var(--ease),border-color .22s var(--ease);font-family:var(--font)}
.preset:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line-soft));box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.preset .pname{font-weight:750;font-size:14px;color:var(--ink)}
.preset .pdesc{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.preset .pchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.preset .chip{font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-2);font-weight:650}
.block .head{display:flex;align-items:center;gap:10px;padding:11px 14px 0 14px;cursor:grab}
.block .tname{font-weight:750;font-size:14.5px;letter-spacing:.1px}
.block .spacer{flex:1}
.statchip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:650;border:1px solid var(--line-soft);color:var(--muted);user-select:none;transition:.18s var(--ease)}
.statchip:hover{color:var(--ink);transform:scale(1.03)}
.statchip .cd{width:7px;height:7px;border-radius:2px;background:currentColor}
.statchip.st-completed{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.statchip.st-partial{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.statchip.st-skipped{background:var(--skip-soft);color:var(--skip);border-color:transparent}
.taskin{width:100%;padding:8px 14px 2px;font-size:14px;font-weight:600;background:transparent;border:none;outline:none;color:inherit;border-radius:8px}
.taskin:focus-visible{outline-offset:0}
.meta{display:flex;gap:14px;padding:2px 14px 12px;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.detail{display:none;padding:12px 14px 14px;border-top:1px dashed var(--line-soft);background:color-mix(in srgb,var(--card2) 46%,transparent)}
.block.open .detail{display:block}
.togglelink{font-size:12px;color:var(--accent);cursor:pointer;font-weight:650}
.togglelink:hover{text-decoration:underline}
.detail .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:.3px}
.field input,.field textarea,.field select{width:100%;padding:8px 10px;border:1px solid var(--line-soft);border-radius:var(--r-sm);background:var(--card2);outline:none;font-size:13px;transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.field textarea{resize:vertical;min-height:52px}
.detail .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn{padding:8px 15px;border-radius:var(--r-sm);font-weight:650;font-size:13px;background:var(--card2);color:var(--ink);border:1px solid var(--line-soft);transition:.18s var(--ease)}
.btn:hover{color:var(--ink)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent;box-shadow:0 5px 16px var(--ring)}
.btn.primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}

/* ---------- overview (Bento stat cards) ---------- */
.summarygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.statcard{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:box-shadow .22s var(--ease),transform .2s var(--ease)}
.statcard:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.statcard::after{content:"";position:absolute;left:0;top:0;height:3px;width:56px;border-radius:0 0 6px 0;background:linear-gradient(90deg,var(--accent),transparent);opacity:.55}
.statcard:nth-child(2)::after{background:linear-gradient(90deg,var(--ok),transparent)}
.statcard:nth-child(3)::after{background:linear-gradient(90deg,var(--warn),transparent)}
.statcard .v{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.statcard .l{font-size:12.5px;color:var(--muted);margin-top:4px;letter-spacing:.3px}

/* ---------- templates ---------- */
.tplgrid{display:grid;gap:12px;margin-top:6px}
.tpl{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px 16px;display:flex;align-items:center;gap:13px;transition:box-shadow .22s var(--ease),border-color .22s var(--ease),transform .2s var(--ease)}
.tpl:hover{border-color:color-mix(in srgb,var(--accent) 34%,var(--line-soft));box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.tpl .sw{width:26px;height:26px;border-radius:var(--r-sm);flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.tpl .info{flex:1;min-width:0}
.tpl .info .t{font-weight:700}
.tpl .info .s{font-size:12.5px;color:var(--muted)}
.tpl .act{display:flex;gap:6px}
.mini{width:auto;min-width:36px;height:36px;padding:0 11px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--card2);border:1px solid var(--line-soft);color:var(--muted);font-size:13px;font-weight:600;transition:.18s var(--ease)}
.mini:hover{color:var(--accent)}
.addtpl{margin-top:16px;width:100%;padding:14px;border-radius:var(--r-md);border:1.5px dashed color-mix(in srgb,var(--muted) 45%,transparent);color:var(--muted);font-weight:650;background:color-mix(in srgb,var(--card) 60%,transparent);transition:.2s var(--ease)}
.addtpl:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:var(--r-sm);cursor:pointer;border:2px solid transparent;transition:.16s var(--ease);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.swatch:hover{transform:scale(1.12)}
.swatch.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
.seg{display:flex;gap:2px;background:var(--card2);padding:3px;border-radius:999px;flex-wrap:wrap}
.seg button{padding:6px 11px;border-radius:999px;font-size:12.5px;color:var(--muted);font-weight:600;background:none;border:none;transition:.18s var(--ease)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm)}
.dow{display:flex;gap:5px;flex-wrap:wrap}
.dow button{width:36px;height:36px;border-radius:50%;font-size:12.5px;background:var(--card2);color:var(--muted);font-weight:600;transition:.18s var(--ease)}
.dow button:hover{color:var(--ink)}
.dow button.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 3px 12px var(--ring)}

.panel{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:24px}
.panel h3{font-size:16px;font-weight:750;margin-bottom:16px;letter-spacing:-.01em}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.formgrid .full{grid-column:1/-1}

/* ---------- review ---------- */
.reviewlist{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.rrow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--shadow);transition:box-shadow .2s var(--ease)}
.rrow:hover{box-shadow:var(--shadow-lg)}
.rrow .grow{flex:1;min-width:0}
.rrow .task{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .tpl,.brow .tpl{font-size:11.5px;color:var(--muted)}
.cdot{flex:none}
.checkbox{width:21px;height:21px;border-radius:7px;border:1.5px solid var(--line);position:relative;flex:none;cursor:pointer;transition:.16s var(--ease)}
.checkbox:hover{border-color:var(--muted)}
.checkbox.on{border-color:var(--accent);background:var(--accent)}
.checkbox.on::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.moodrow{display:flex;gap:9px;margin-top:14px}
.moodrow button{width:42px;height:42px;border-radius:var(--r-md);background:var(--card2);font-size:19px;border:1px solid var(--line-soft);transition:.18s var(--ease);filter:grayscale(.28)}
.moodrow button:hover{transform:translateY(-2px);box-shadow:var(--shadow);filter:none}
.moodrow button.on{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);filter:none}
.reviewtextarea{width:100%;min-height:110px;margin-top:16px;padding:12px;border:1px solid var(--line-soft);border-radius:var(--r-md);background:var(--card2);outline:none;resize:vertical;transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
.reviewtextarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}

/* ---------- backlog ---------- */
.backlogheader{margin:8px 0 14px}
.backlogheader h2{font-size:23px;font-weight:800;letter-spacing:-.02em}
.backloglist{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.brow{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--shadow);transition:box-shadow .2s var(--ease)}
.brow:hover{box-shadow:var(--shadow-lg)}
.brow .grow{flex:1;min-width:0}
.brow .task{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- week ---------- */
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-top:6px}
.wcol{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:13px;min-height:150px;box-shadow:var(--shadow);transition:box-shadow .22s var(--ease)}
.wcol:hover{box-shadow:var(--shadow-lg)}
.wcol.today{border-color:color-mix(in srgb,var(--accent) 45%,transparent);border-width:1.5px;background:color-mix(in srgb,var(--accent-soft) 30%,var(--card))}
.wtop{font-size:12px;font-weight:700;margin-bottom:10px;color:var(--muted);letter-spacing:.4px}
.wtop .dnum{display:block;color:var(--ink);font-size:17px;margin-top:2px;font-variant-numeric:tabular-nums}
.wtop.todaycol .dnum{color:var(--accent)}
.wchip{display:flex;align-items:center;gap:6px;font-size:11.5px;margin-bottom:6px;padding:6px 7px;border-radius:var(--r-sm);background:var(--card2);cursor:pointer;color:var(--ink);transition:.18s var(--ease)}
.wchip:hover{background:color-mix(in srgb,var(--accent-soft) 60%,var(--card2))}
.wchip .cdot{width:8px;height:8px;border-radius:3px;flex:none}
.wchip .wname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wchip .st{font-size:10px;font-weight:600}
.wempty{color:var(--muted);font-size:11.5px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,11,18,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.on{display:flex;animation:veilIn .22s var(--ease)}
@keyframes veilIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:var(--r-xl);box-shadow:0 30px 70px rgba(0,0,0,.32);width:100%;max-width:560px;padding:24px;max-height:88vh;overflow:auto;border:1px solid var(--line-soft);animation:modalIn .3s var(--ease)}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.975)}to{opacity:1;transform:none}}
.modal h3{font-size:17px;font-weight:760;margin-bottom:18px;letter-spacing:-.01em}
.modal .mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(22px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:var(--r-md);font-size:13.5px;font-weight:550;opacity:0;transition:.3s var(--ease);z-index:99;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- onboarding tour ---------- */
.tour-veil{position:fixed;inset:0;background:rgba(8,11,18,.52);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:60;transition:clip-path .22s var(--ease)}
.tour-hl{position:fixed;border:2px solid var(--accent);border-radius:var(--r-md);z-index:61;pointer-events:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent);transition:all .22s var(--ease)}
.tour-bubble{position:fixed;z-index:62;width:336px;max-width:calc(100vw - 28px);background:var(--card);color:var(--ink);border:1px solid var(--line-soft);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:18px 20px;font-size:13.5px;line-height:1.55;animation:modalIn .26s var(--ease)}
.tour-bubble .blead{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--accent);margin-bottom:7px}
.tour-bubble .btitle{font-size:16px;font-weight:780;margin-bottom:7px;letter-spacing:-.01em}
.tour-bubble .bcopy{color:var(--muted)}
.tour-bubble .ctr{display:flex;align-items:center;gap:8px;margin-top:16px}
.tour-bubble .ctr .dotg{flex:1;display:flex;gap:5px}
.tour-bubble .ctr .dotg i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.2s var(--ease)}
.tour-bubble .ctr .dotg i.on{background:var(--accent);transform:scale(1.15)}
.tour-bubble .ctr button{padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:650;border:1px solid var(--line-soft);background:var(--card2);color:var(--ink);transition:.18s var(--ease)}
.tour-bubble .ctr button:hover{color:var(--accent)}
.tour-bubble .ctr button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent;box-shadow:0 4px 12px var(--ring)}
.tour-bubble .ctr button.primary:hover{filter:brightness(1.05)}
.tour-bubble .ctr button:disabled{opacity:.4;cursor:default}
.tour-bubble .skip{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--muted);font-size:12.5px;cursor:pointer;transition:.16s var(--ease)}
.tour-bubble .skip:hover{color:var(--danger)}
.tour-bubble .arr{position:absolute;width:0;height:0;border:10px solid transparent;pointer-events:none}
.tour-bubble .arr.t{top:-20px;border-bottom:10px solid var(--card)}
.tour-bubble .arr.b{bottom:-20px;border-top:10px solid var(--card)}
/* ---- 理念开场 philo ---- */
.philo-veil{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:63;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeUp .32s var(--ease)}
.philo-card{position:relative;width:min(460px,100%);background:var(--card);border:1px solid var(--line-soft);border-radius:22px;box-shadow:var(--shadow-lg);padding:30px 32px 24px;text-align:center}
.philo-card .plogo{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:18px}
.philo-card .plogo .dot{width:14px;height:14px;border-radius:5px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 2px 8px var(--ring)}
.philo-card .plogo span{font-weight:800;font-size:17px;letter-spacing:.2px}
.philo-card .plead{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--accent);margin-bottom:8px}
.philo-card .ptitle{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.philo-card .pcopy{color:var(--muted);font-size:14.5px;line-height:1.7;min-height:84px}
.philo-card .ptag{display:inline-block;margin:14px 0 4px;padding:6px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:650}
.philo-card .pfoot{display:flex;align-items:center;gap:10px;margin-top:20px}
.philo-card .pfoot .dots{flex:1;display:flex;justify-content:center;gap:6px}
.philo-card .pfoot .dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.2s var(--ease)}
.philo-card .pfoot .dots i.on{background:var(--accent);transform:scale(1.18)}
.philo-card .skip{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--muted);font-size:12.5px;cursor:pointer;transition:.16s var(--ease)}
.philo-card .skip:hover{color:var(--danger)}
/* ---- review markdown preview ---- */
.reviewtextwrap{display:flex;flex-direction:column;margin-top:16px}
.reviewtextwrap .mdbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.reviewtextwrap .mdbar .hint{font-size:11.5px;color:var(--muted);flex:1}
.reviewtextwrap .mdbtn{padding:5px 13px;border-radius:999px;font-size:12px;font-weight:650;border:1px solid var(--line-soft);background:var(--card2);color:var(--muted);transition:.18s var(--ease)}
.reviewtextwrap .mdbtn:hover{color:var(--ink)}
.reviewtextwrap .mdbtn.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.reviewtextwrap .mdpanel{display:none;width:100%;min-height:110px;padding:12px;border:1px solid var(--line-soft);border-radius:var(--r-md);background:var(--card2)}
.reviewtextwrap .mdpanel.show{display:block}
.reviewtextwrap .mdpanel h1,.reviewtextwrap .mdpanel h2,.reviewtextwrap .mdpanel h3{font-weight:750;line-height:1.4;margin:.2em 0}
.reviewtextwrap .mdpanel h1{font-size:19px}.reviewtextwrap .mdpanel h2{font-size:16.5px}.reviewtextwrap .mdpanel h3{font-size:14.5px}
.reviewtextwrap .mdpanel ul,.reviewtextwrap .mdpanel ol{margin:.4em 0 .4em 1.3em}
.reviewtextwrap .mdpanel li{margin:.15em 0}
.reviewtextwrap .mdpanel code{background:var(--card2);border:1px solid var(--line-soft);border-radius:6px;padding:1px 6px;font-size:12.5px;font-family:ui-monospace,Consolas,monospace}
.reviewtextwrap .mdpanel p{margin:.3em 0}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:720px){ .summarygrid{grid-template-columns:1fr} .weekgrid{grid-template-columns:repeat(2,1fr)} .nav{order:9;width:100%;justify-content:space-between;margin-left:0} }
</style>
</head>
<body data-theme="light" data-palette="salt">
<div class="app">
  <div class="topbar">
    <div class="logo"><span class="dot"></span>PlanLoop</div>
    <nav class="nav" id="nav">
      <button type="button" data-view="day">今日</button>
      <button type="button" data-view="week">本周</button>
      <button type="button" data-view="review">复盘</button>
      <button type="button" data-view="backlog">待办池</button>
      <button type="button" data-view="templates">模板</button>
    </nav>
    <button class="iconbtn" id="onboardBtn" title="新手引导">？</button>
    <span id="paletteWrap">
      <button class="iconbtn" id="paletteBtn" title="选择主题色">◈</button>
    </span>
    <button class="iconbtn" id="themeBtn" title="切换明暗">◐</button>
    <button class="iconbtn" id="exportBtn" title="导出 JSON">⇩</button>
    <button class="iconbtn" id="importBtn" title="导入 JSON">⇧</button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
  </div>
  <div class="palette" id="paletteMenu" role="menu" aria-label="选择主题色">
    <div class="ptitle">主题色</div>
    <button type="button" class="pdot on" data-pal="salt" title="海盐蓝" style="--c:#0a84ff"></button>
    <button type="button" class="pdot" data-pal="amber" title="琥珀金" style="--c:#b7791f"></button>
    <button type="button" class="pdot" data-pal="jade" title="翡翠绿" style="--c:#0f8a5f"></button>
    <button type="button" class="pdot" data-pal="violet" title="暮紫" style="--c:#7a5af8"></button>
    <button type="button" class="pdot" data-pal="onyx" title="曜墨" style="--c:#46607e"></button>
  </div>

  <!-- DAY -->
  <section class="view on" id="view-day">
    <div class="datenav" style="justify-content:center;margin:2px 0 8px">
      <button class="datebtn" id="dayPrev">‹</button>
      <span class="datelabel" id="dayLabel"></span>
      <button class="datebtn" id="dayNext">›</button>
      <button class="todaybtn" id="todayBtn">今天</button>
    </div>
    <div class="dayhead">
      <h2 id="dayTitle">今日</h2>
      <span class="sub" id="daySub"></span>
    </div>
    <div class="summarygrid" id="daySummary"></div>
    <div id="timeline" class="timeline"></div>
    <div class="emptyhint" id="emptyHint" style="display:none">这一天没有时间块。去「模板」里添加或新建一个固定时间块结构吧。</div>
  </section>

  <!-- WEEK -->
  <section class="view" id="view-week">
    <div style="display:flex;align-items:center;gap:10px;margin:2px 0 12px">
      <button class="datebtn" id="weekPrev">‹</button>
      <span class="datelabel flex" id="weekLabel"></span>
      <button class="datebtn" id="weekNext">›</button>
      <button class="todaybtn" id="weekToday">本周</button>
    </div>
    <div class="weekgrid" id="weekGrid"></div>
  </section>

  <!-- REVIEW -->
  <section class="view" id="view-review">
    <div class="datenav" style="justify-content:center;margin:2px 0 10px">
      <button class="datebtn" id="revPrev">‹</button>
      <span class="datelabel" id="revLabel"></span>
      <button class="datebtn" id="revNext">›</button>
      <button class="todaybtn" id="revToday">今天</button>
    </div>
    <div class="panel">
      <h3>计划 vs 实际</h3>
      <div class="reviewlist" id="reviewList"></div>
      <div id="reviewFooter">
        <div style="display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap">
          <span style="font-size:12px;color:var(--muted)">今天心情：</span>
          <div class="moodrow" id="moodRow" style="margin-top:0">
            <button type="button" data-mood="1">😞</button><button type="button" data-mood="2">😐</button><button type="button" data-mood="3">🙂</button>
          </div>
        </div>
        <div class="reviewtextwrap">
          <div class="mdbar">
            <span class="hint">支持 Markdown：# 标题、**加粗**、- 列表</span>
            <button type="button" class="mdbtn" id="revPreviewToggle">预览</button>
          </div>
          <textarea class="reviewtextarea" id="reviewText" placeholder="今天的复盘：哪里安排得不好？什么没做成？下次怎么调整？"></textarea>
          <div class="mdpanel" id="reviewPreview"></div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:12px">
          <button class="btn primary" id="revSend">把勾选的放进待办池</button>
        </div>
      </div>
    </div>
  </section>

  <!-- BACKLOG -->
  <section class="view" id="view-backlog">
    <div class="backlogheader"><h2>遗留待办池</h2></div>
    <div class="backloglist" id="backlogList"></div>
  </section>

  <!-- TEMPLATES -->
  <section class="view" id="view-templates">
    <div class="dayhead"><h2>时间块结构</h2><span class="sub">结构固定不变，每天往里填内容；改动只影响未来未定形的日子</span></div>
    <div class="presets" id="presetStrip"></div>
    <div class="tplgrid" id="tplGrid"></div>
    <button class="addtpl" id="addTpl">+ 新建时间块</button>
  </section>
</div>

<!-- template modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">时间块</h3>
    <div class="formgrid">
      <div class="field full"><label>名称</label><input id="f_name" placeholder="如：深度工作"></div>
      <div class="field"><label>开始</label><input type="time" id="f_start"></div>
      <div class="field"><label>结束（可跨零点）</label><input type="time" id="f_end"></div>
      <div class="field full"><label>颜色</label><div class="swatches" id="swatches"></div></div>
      <div class="field full"><label>重复</label><div class="seg" id="repeatSeg"></div></div>
      <div class="field full" id="dowWrap"><label>选择星期</label><div class="dow" id="dowRow"></div></div>
    </div>
    <div class="mfoot">
      <button class="btn danger" id="delTpl" style="display:none;margin-right:auto">删除</button>
      <button class="btn" id="cancelTpl">取消</button>
      <button class="btn primary" id="saveTpl">保存</button>
    </div>
  </div>
</div>

<!-- assign modal -->
<div class="overlay" id="assignOverlay">
  <div class="modal" style="max-width:420px">
    <h3 id="aiTitle">分配待办</h3>
    <div class="formgrid">
      <div class="field full"><label>目标日期</label><input type="date" id="aiDate"></div>
      <div class="field full"><label>目标时间块</label><select id="aiBlock"></select></div>
    </div>
    <div class="mfoot">
      <button class="btn" id="aiCancel">取消</button>
      <button class="btn primary" id="aiOk">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/*==DOM:CORE==*/
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function dstr(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function parseD(s) { return new Date(s + 'T12:00:00'); }
function addDays(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); }
function todayStr() { return dstr(new Date()); }
function hmToMin(s) { if (!s) return 0; var p = String(s).split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
function minToHM(n) { n = Math.max(0, Math.round(n)); var h = Math.floor(n / 60), m = n % 60; return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0'); }
function clampStart(startMin, durMin) { if (durMin <= 0) return startMin; return Math.max(0, Math.min(startMin, 1440 - durMin)); }

function normMood(v) {
  v = +v || 0;
  if (v <= 0) return 0;
  if (v <= 2) return 1;
  if (v === 3) return 2;
  return 3;
}

/* Markdown 子集 → HTML。所有用户文本先转义再套标签，杜绝 XSS。 */
function mdEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function mdInline(s) {
  var out = '', re = /(`[^`]+`)|(\*\*[^*\n]+\*\*)/g, last = 0, m;
  s = String(s == null ? '' : s);
  while ((m = re.exec(s)) !== null) {
    out += mdEsc(s.slice(last, m.index));
    if (m[1]) out += '<code>' + mdEsc(m[1].slice(1, -1)) + '</code>';
    else out += '<strong>' + mdEsc(m[2].slice(2, -2)) + '</strong>';
    last = re.lastIndex;
  }
  out += mdEsc(s.slice(last));
  return out;
}
function mdToHtml(src) {
  if (!src) return '';
  var lines = String(src).split(/\n/);
  var i = 0, out = [], ul = [], ol = [], plain = [];
  function flushPlain() { if (plain.length) { out.push('<p>' + plain.join('<br>') + '</p>'); plain = []; } }
  function flushUl() { if (ul.length) { out.push('<ul><li>' + ul.join('</li><li>') + '</li></ul>'); ul = []; } }
  function flushOl() { if (ol.length) { out.push('<ol><li>' + ol.join('</li><li>') + '</li></ol>'); ol = []; } }
  while (i < lines.length) {
    var t = lines[i].trim();
    if (!t) { flushPlain(); flushUl(); flushOl(); i++; continue; }
    var h = /^(#{1,3})\s+(.+)/.exec(t);
    if (h) { flushPlain(); flushUl(); flushOl(); var hh = h[1].length; out.push('<h' + hh + '>' + mdInline(h[2]) + '</h' + hh + '>'); i++; continue; }
    if (/^(-|\*)\s+/.test(t)) { flushPlain(); flushOl(); ul.push(mdInline(t.replace(/^(-|\*)\s+/, ''))); i++; continue; }
    if (/^\d+\.\s+/.test(t)) { flushPlain(); flushUl(); ol.push(mdInline(t.replace(/^\d+\.\s+/, ''))); i++; continue; }
    flushUl(); flushOl();
    plain.push(mdInline(lines[i]));
    i++;
  }
  flushPlain(); flushUl(); flushOl();
  return out.join('\n');
}

const DOW_LABEL = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

function tplApplies(t, dayStr) {
  const dow = parseD(dayStr).getDay();
  switch (t.repeat) {
    case 'daily': return true;
    case 'weekday': return dow >= 1 && dow <= 5;
    case 'weekend': return dow === 0 || dow === 6;
    case 'custom': return Array.isArray(t.customDays) && t.customDays.indexOf(dow) !== -1;
    default: return false;
  }
}

function repeatLabel(t) {
  switch (t.repeat) {
    case 'daily': return '每天';
    case 'weekday': return '工作日';
    case 'weekend': return '周末';
    case 'custom': return '每周' + (t.customDays || []).map(function (d) { return DOW_LABEL[d]; }).join('、');
    default: return '';
  }
}

function minutesOf(start, end) {
  var toMin = function (h) { var p = h.split(':'); return (+p[0]) * 60 + (+p[1]); };
  var s = toMin(start), e = toMin(end);
  if (e <= s) e += 24 * 60;
  return e - s;
}

function blocksFromTemplates(templates, dayStr) {
  return templates.filter(function (t) { return tplApplies(t, dayStr); }).map(function (t) {
    return {
      id: genId(), name: t.name, start: t.start, end: t.end, color: t.color,
      taskName: '', note: '', est: minutesOf(t.start, t.end),
      as: '', ae: '', status: '', anote: '', carrySent: false
    };
  });
}

function createDomain(state) {
  function dayRecord(dayStr) {
    return { blocks: blocksFromTemplates(state.templates, dayStr), review: { text: '', mood: 0 } };
  }
  function getMaterialized(dayStr) { return state.days[dayStr] || null; }
  function ensureToday() {
    const t = todayStr();
    if (!state.days[t]) state.days[t] = dayRecord(t);
  }
  function writeBlock(dayStr, blockId, patch) {
    if (!state.days[dayStr]) state.days[dayStr] = dayRecord(dayStr);
    const blk = state.days[dayStr].blocks.filter(function (b) { return b.id === blockId; })[0];
    if (!blk) return false;
    Object.assign(blk, patch);
    return true;
  }
  function projectBlocks(dayStr) {
    if (state.days[dayStr]) return state.days[dayStr].blocks;
    return blocksFromTemplates(state.templates, dayStr);
  }
  function addToBacklog(srcDate, srcBlockId) {
    const day = state.days[srcDate];
    if (!day) return null;
    const blk = day.blocks.filter(function (b) { return b.id === srcBlockId; })[0];
    if (!blk || !blk.taskName) return null;
    const entry = { id: genId(), srcDate: srcDate, srcBlock: srcBlockId, taskName: blk.taskName, note: blk.note, est: blk.est, status: 'open' };
    state.backlog.push(entry);
    blk.carrySent = true;
    return entry;
  }
  function assignFromBacklog(entryId, dayStr, blockId) {
    const entry = state.backlog.filter(function (e) { return e.id === entryId && e.status === 'open'; })[0];
    if (!entry) return false;
    if (!state.days[dayStr]) state.days[dayStr] = dayRecord(dayStr);
    const blk = state.days[dayStr].blocks.filter(function (b) { return b.id === blockId; })[0];
    if (!blk) return false;
    blk.taskName = entry.taskName; blk.note = entry.note; blk.est = entry.est;
    entry.status = 'done';
    return true;
  }
  function exportState() { return JSON.stringify(state); }
  function parseImport(str) {
    let v;
    try { v = JSON.parse(str); } catch (e) { return null; }
    if (!v || v.v !== 2 || v.templates === undefined || v.days === undefined || v.backlog === undefined) return null;
    return v;
  }
  function importState(jsonStr) {
    const parsed = parseImport(jsonStr);
    if (!parsed) return false;
    Object.keys(state).forEach(function (k) { delete state[k]; });
    Object.assign(state, parsed);
    return true;
  }
  return {
    getMaterialized: getMaterialized, ensureToday: ensureToday, writeBlock: writeBlock, projectBlocks: projectBlocks,
    addToBacklog: addToBacklog, assignFromBacklog: assignFromBacklog, exportState: exportState, importState: importState,
    todayStr: todayStr, addDays: addDays, hmToMin: hmToMin, minToHM: minToHM, clampStart: clampStart, normMood: normMood, mdToHtml: mdToHtml
  };
}

      if (rangeOverlap(temp, o.b)) { o.el.classList.add('drag-hit'); hits.push(o.b.name); }
      else o.el.classList.remove('drag-hit');
    }
    var tip = drag.el.querySelector('.clashtip');
    if (hits.length) {
      if (!tip) { tip = document.createElement('div'); tip.className = 'clashtip'; drag.el.appendChild(tip); }
      tip.textContent = '⚠ 时段重叠：' + hits.join('、');
    } else if (tip) { tip.remove(); }
  });
  function resolveDropCollision(ns, dur, bid, orig) {
    var others = blocksOf(dayDate).filter(function (x) { return x.id !== bid; });
    var temp = { start: ns, end: ns + dur };
    if (!others.some(function (o) { return rangeOverlap(temp, o); })) return ns;
    var conflicting = others.filter(function (o) { return rangeOverlap(temp, o); });
    var cstart = Math.min.apply(null, conflicting.map(function (o) { return domain.hmToMin(o.start); }));
    var before = Math.floor((cstart - dur) / 5) * 5;
    if (before >= 0 && before + dur <= 1440) {
      var cand = { start: before, end: before + dur };
      if (!others.some(function (o) { return rangeOverlap(cand, o); })) return before;
    }
    return orig;
  }

    d.el.classList.remove('dragging');
    var ns = (typeof d.ns === 'number') ? d.ns : Math.round(parseFloat(d.el.style.top) / TLM_PPM / 5) * 5;
    ns = domain.clampStart(ns, d.dur);
    var finalNs = resolveDropCollision(ns, d.dur, d.bid, d.orig);
    d.el.style.top = (finalNs * TLM_PPM) + 'px';
    domain.writeBlock(dayDate, d.bid, { start: domain.minToHM(finalNs), end: domain.minToHM(finalNs + d.dur) });

      lead: '第 1 步 / 共 5 步', title: '今日 · 你的每日主界面',
      copy: '打开应用默认落在「今日」。时间块结构已在这里就位，你只需往每个时间块里填当天要做什么。' },
    { sel: '.statchip', fallback: '#daySummary',
      lead: '第 2 步 / 共 5 步', title: '状态徽章 · 一键标记执行',
      copy: '每个时间块卡片右侧有个状态徽章。点击它可循环切换：未开始 → 已完成 → 部分完成 → 跳过，标记后颜色会随之变化。' },
    { sel: '.nav button[data-view="review"]', fallback: null,
      lead: '第 3 步 / 共 5 步', title: '复盘 · 计划 vs 实际',
      copy: '一天结束时来这里对比「计划 vs 实际」。未完成的任务勾选后放进待办池，还能记下心情和复盘笔记。' },
    { sel: '.nav button[data-view="backlog"]', fallback: null,
      lead: '第 4 步 / 共 5 步', title: '待办池 · 跨日收容',
      copy: '从复盘放进来的未完成任务会暂存在这里。次日做计划时，把它们分配到某个时间块里继续推进。' },
    { sel: '.nav button[data-view="templates"]', fallback: null,
      lead: '第 5 步 / 共 5 步', title: '模板 · 一次搭好结构',
      copy: '时间块结构在这里一次搭好，之后每天只往填内容。改动只影响未来未定形的日子，过去已计划的计划不受影响。' }
  ];

  var tourIdx = -1;
  var tourVeil = null, tourHl = null, tourBubble = null;
  var tourEsc = null, tourResize = null, tourScroll = null;

  function tourMarkSeen() {
    if (!state.settings.onboarded) { state.settings.onboarded = true; persist(); }
  }
  function tourTarget(idx) {
    var s = TOUR_STEPS[idx];
    var el = document.querySelector(s.sel);
    if (!el && s.fallback) el = document.querySelector(s.fallback);
    return el;
  }
  function tourPosition(idx) {
    var el = tourTarget(idx);
    var vw = window.innerWidth, vh = window.innerHeight;
    if (!el) { tourVeil.style.clipPath = 'none'; tourHl.style.display = 'none'; positionBubbleOut(idx); return; }
    var r = el.getBoundingClientRect();
    var pad = 6;
    var x = Math.max(0, r.left - pad), y = Math.max(0, r.top - pad);
    var w = r.width + pad * 2, h = r.height + pad * 2;
    x = Math.min(x, vw - w); y = Math.min(y, vh - h);
    tourVeil.style.clipPath = 'inset(' + y + 'px ' + (vw - x - w) + 'px ' + (vh - y - h) + 'px ' + x + 'px round 8px)';
    tourHl.style.left = (x - 1) + 'px'; tourHl.style.top = (y - 1) + 'px';
    tourHl.style.width = (w + 2) + 'px'; tourHl.style.height = (h + 2) + 'px'; tourHl.style.display = 'block';
    placeBubble(r);
  }
  function placeBubble(rect) {
    var bw = 320, m = 14, gap = 8, bh = 150;
    var cx = Math.round(rect.left + rect.width / 2);
    var x = cx - bw / 2;
    x = Math.max(m, Math.min(x, window.innerWidth - bw - m));
    var below = rect.bottom + gap, above = rect.top - gap - bh;
    var placeBelow;
    if (below + bh <= window.innerHeight - m) placeBelow = true;
    else if (above >= m) placeBelow = false;
    else placeBelow = rect.bottom < window.innerHeight / 2;
    tourBubble.style.left = x + 'px';
    tourBubble.style.top = (placeBelow ? below : above) + 'px';
    var arr = tourBubble.querySelector('.arr');
    if (arr) {
      var arrX = cx - x;
      arrX = Math.max(20, Math.min(arrX, bw - 20));
      arr.style.left = (arrX - 9) + 'px';
      arr.className = 'arr ' + (placeBelow ? 't' : 'b');
    }
  }
  function positionBubbleOut(idx) {
    var bw = 320, bh = 190;
    var x = Math.round((window.innerWidth - bw) / 2);
    var y = Math.round((window.innerHeight - bh) / 2);
    tourBubble.style.left = Math.max(14, x) + 'px';
    tourBubble.style.top = Math.max(14, y) + 'px';
    tourHl.style.display = 'none';
  }
  function renderTour() {
    var s = TOUR_STEPS[tourIdx];
    var isLast = tourIdx === TOUR_STEPS.length - 1;
    var isFirst = tourIdx === 0;
    tourBubble.innerHTML =
      '<button class="skip" data-skip aria-label="跳过">跳过</button>' +
      '<div class="blead">' + esc(s.lead) + '</div>' +
      '<div class="btitle">' + esc(s.title) + '</div>' +
      '<div class="bcopy">' + esc(s.copy) + '</div>' +
      '<div class="ctr">' +
        '<div class="dotg">' + TOUR_STEPS.map(function (_, i) { return '<i class="' + (i === tourIdx ? 'on' : '') + '"></i>'; }).join('') + '</div>' +
        '<button data-prev ' + (isFirst ? 'disabled' : '') + '>上一步</button>' +
        '<button data-next class="primary">' + (isLast ? '完成' : '下一步') + '</button>' +
      '</div>' +
      '<span class="arr"></span>';
    tourPosition(tourIdx);
  }
  function startTour() {
    if (tourIdx !== -1) return;
    tourIdx = 0;
    if (!tourVeil) {
      tourVeil = document.createElement('div'); tourVeil.className = 'tour-veil';
      tourHl = document.createElement('div'); tourHl.className = 'tour-hl';
      tourBubble = document.createElement('div'); tourBubble.className = 'tour-bubble';
      document.body.appendChild(tourVeil); document.body.appendChild(tourHl); document.body.appendChild(tourBubble);
      tourBubble.addEventListener('click', function (e) {
        if (e.target.closest('[data-next]')) {
          if (tourIdx === TOUR_STEPS.length - 1) { finishTour(); return; }
          tourIdx++; renderTour();
        } else if (e.target.closest('[data-prev]')) {
          if (tourIdx > 0) { tourIdx--; renderTour(); }
        } else if (e.target.closest('[data-skip]')) { finishTour(); }
      });
      tourVeil.addEventListener('click', function () { finishTour(); });
      tourEsc = function (e) { if (e.key === 'Escape') finishTour(); };
      tourResize = function () { if (tourIdx !== -1) tourPosition(tourIdx); };
      tourScroll = function () { if (tourIdx !== -1) tourPosition(tourIdx); };
      window.addEventListener('keydown', tourEsc);
      window.addEventListener('resize', tourResize);
      window.addEventListener('scroll', tourScroll, true);
    }
    tourVeil.style.display = 'block';
    tourHl.style.display = 'block';
    tourBubble.style.display = 'block';
    renderTour();
  }
  function finishTour() {
    if (tourIdx === -1) return;
    tourMarkSeen();
    tourIdx = -1;
    tourVeil.style.display = tourHl.style.display = tourBubble.style.display = 'none';
  }
  document.getElementById('onboardBtn').onclick = function () { startTour(); };

  /* ---- philo intro (CR-009) ---- */
  var PHILO_CARDS = [
    { lead: 'PLANLOOP 的设计哲学', t: '把决定提前', c: '"今天干嘛"是最耗意志力的决定，别等早晨现想——用固定时间块结构提前排好，把意志力留给执行本身。', tag: '决策前移' },
    { lead: 'PLANLOOP 的设计哲学', t: '结构护住黄金时段', c: '10 点默认就是深度工作，结构性挡住刷手机；休息就是休息，不必为自己高效之外的时段自责。', tag: '保护黄金时段' },
    { lead: 'PLANLOOP 的设计哲学', t: '只影响未来', c: '改结构只影响还没定形的日子，已经记录的过去不会被推翻——放心试，错了明天再调。', tag: '宽容的迭代' }
  ];
  var philoIdx = -1;
  var philoVeil = null, philoCard = null;
  function philoMarkSeen() {
    if (!state.settings.philoIntro) { state.settings.philoIntro = true; persist(); }
  }
  function renderPhilo() {
    var s = PHILO_CARDS[philoIdx];
    philoCard.innerHTML =
      '<button type="button" class="skip" data-pskip title="跳过">跳过</button>' +
      '<div class="plogo"><span class="dot"></span>PlanLoop</div>' +
      '<div class="plead">' + esc(s.lead) + '</div>' +
      '<div class="ptitle">' + esc(s.t) + '</div>' +
      '<div class="pcopy">' + esc(s.c) + '</div>' +
      '<div class="ptag">' + esc(s.tag) + '</div>' +
      '<div class="pfoot">' +
        '<div class="dots">' + PHILO_CARDS.map(function (_, i) { return '<i class="' + (i === philoIdx ? 'on' : '') + '"></i>'; }).join('') + '</div>' +
        '<button type="button" class="btn primary" data-pnext>' + (philoIdx === PHILO_CARDS.length - 1 ? '开始使用' : '下一步') + '</button>' +
      '</div>';
  }
  function startPhilo() {
    if (philoIdx !== -1) return;
    philoIdx = 0;
    if (!philoVeil) {
      philoVeil = document.createElement('div'); philoVeil.className = 'philo-veil';
      philoCard = document.createElement('div'); philoCard.className = 'philo-card';
      philoVeil.appendChild(philoCard);
      document.body.appendChild(philoVeil);
      philoCard.addEventListener('click', function (e) {
        if (e.target.closest('[data-pnext]')) {
          if (philoIdx === PHILO_CARDS.length - 1) { finishPhilo(true); return; }
          philoIdx++; renderPhilo();
        } else if (e.target.closest('[data-pskip]')) { finishPhilo(false); }
      });
    }
    philoVeil.style.display = 'flex';
    renderPhilo();
  }
  function finishPhilo(continueTour) {
    if (philoIdx === -1) return;
    philoMarkSeen();
    philoIdx = -1;
    philoVeil.style.display = 'none';
    philoCard.innerHTML = '';
    if (continueTour && !state.settings.onboarded) startTour();
  }

  /* ---- initial render ---- */
  switchView('day');
  if (!state.settings.philoIntro && !state.settings.onboarded) startPhilo();
  else if (!state.settings.onboarded) startTour();
});
</script>
