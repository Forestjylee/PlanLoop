<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlanLoop · 时间块执行台</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --card2:#f1f3f6; --ink:#1a1d23; --muted:#6b7280;
  --line:#e5e8ee; --accent:#4f6ef7; --accent-soft:#eaf0ff;
  --ok:#2f9e6e; --ok-soft:#e3f5ec; --warn:#c98a1b; --warn-soft:#fbf1dd;
  --skip:#9aa3b0; --skip-soft:#eef0f3; --danger:#d9534f;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.05);
  --radius:12px;
}
[data-theme="dark"]{
  --bg:#0f1115; --card:#171a20; --card2:#1e2229; --ink:#e8eaee; --muted:#9aa3b0;
  --line:#262b34; --accent:#6f89ff; --accent-soft:#1c2440;
  --ok:#3fb57f; --ok-soft:#123024; --warn:#dba52f; --warn-soft:#32260d;
  --skip:#7c8694; --skip-soft:#20242b; --danger:#e06966;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;transition:background .2s,color .2s}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}

.app{display:flex;flex-direction:column;height:100vh;max-width:980px;margin:0 auto;padding:0 16px}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:14px 0 12px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.3px;font-size:16px;display:flex;align-items:center;gap:7px}
.logo .dot{width:11px;height:11px;border-radius:3px;background:var(--accent)}
.nav{margin-left:auto;display:flex;gap:4px;background:var(--card2);padding:3px;border-radius:10px}
.nav button{padding:6px 13px;border-radius:8px;color:var(--muted);font-weight:500}
.nav button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.iconbtn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted);background:var(--card);border:1px solid var(--line);font-size:15px}
.iconbtn:hover{color:var(--ink);border-color:var(--muted)}
.datenav{display:flex;align-items:center;gap:6px}
.datebtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.datebtn:hover{color:var(--ink)}
.datelabel{min-width:120px;text-align:center;font-weight:600}
.todaybtn{height:30px;padding:0 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px}

/* ---------- Views ---------- */
.view{display:none;flex:1;overflow:auto;padding-bottom:24px}
.view.on{display:block}

/* ---------- Day view ---------- */
.dayhead{display:flex;align-items:baseline;gap:10px;margin:6px 0 14px}
.dayhead h2{font-size:19px}
.dayhead .sub{color:var(--muted);font-size:13px}
.emptyhint{color:var(--muted);text-align:center;padding:26px 0;font-size:13px}

.timeline{display:flex;flex-direction:column;gap:10px}
.block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.block .bar{height:4px}
.block .head{display:flex;align-items:center;gap:9px;padding:11px 14px 0}
.block .tname{font-weight:700;font-size:14px}
.block .time{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.block .spacer{flex:1}
.statchip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--muted);user-select:none}
.statchip:hover{border-color:var(--muted)}
.statchip .cd{width:7px;height:7px;border-radius:2px;background:currentColor}
.statchip.st-completed{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.statchip.st-partial{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.statchip.st-skipped{background:var(--skip-soft);color:var(--skip);border-color:transparent}
.taskin{width:100%;padding:9px 14px;font-size:14px;font-weight:600;background:transparent;border:none;outline:none}
.meta{display:flex;gap:14px;padding:0 14px 12px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:600}
.detail{display:none;padding:0 14px 14px;border-top:1px dashed var(--line);margin:0 12px}
.block.open .detail{display:block}
.togglelink{font-size:12px;color:var(--accent);cursor:pointer;font-weight:500}
.detail .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding-top:12px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card2);outline:none;font-size:13px}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:52px}
.detail .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn{padding:7px 14px;border-radius:8px;font-weight:600;font-size:13px;background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.danger{color:var(--danger)}

/* ---------- day footer: finish day ---------- */
.dayfooter{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.finishrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bigbtn{flex:1;min-width:200px;padding:13px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:14px}
.bigbtn:hover{filter:brightness(1.05)}
.hint{color:var(--muted);font-size:12px}

/* ---------- templates ---------- */
.tplgrid{display:grid;gap:10px;margin-top:6px}
.tpl{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 15px;display:flex;align-items:center;gap:12px}
.tpl .sw{width:22px;height:22px;border-radius:7px;flex:none}
.tpl .info{flex:1;min-width:0}
.tpl .info .t{font-weight:700}
.tpl .info .s{font-size:12px;color:var(--muted)}
.tpl .act{display:flex;gap:6px}
.mini{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.mini:hover{color:var(--accent);border-color:var(--accent)}
.addtpl{margin-top:12px;width:100%;padding:12px;border-radius:12px;border:1.5px dashed var(--line);color:var(--muted);font-weight:600}
.addtpl:hover{color:var(--accent);border-color:var(--accent)}

.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:22px;height:22px;border-radius:6px;cursor:pointer;border:2px solid transparent}
.swatch.on{border-color:var(--ink)}
.seg{display:flex;gap:4px;background:var(--card2);padding:3px;border-radius:9px;flex-wrap:wrap}
.seg button{padding:5px 10px;border-radius:7px;font-size:12px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.dow{display:flex;gap:5px;flex-wrap:wrap}
.dow button{width:32px;height:32px;border-radius:50%;font-size:12px;background:var(--card2);color:var(--muted);font-weight:600}
.dow button.on{background:var(--accent);color:#fff}
.timeinput{display:flex;gap:6px;align-items:center}
.timeinput input{width:78px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.panel h3{font-size:15px;margin-bottom:14px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.formgrid .full{grid-column:1/-1}

/* ---------- review ---------- */
.reviewlist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.rrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rrow .grow{flex:1;min-width:0}
.rrow .task{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .tpl{font-size:11px;color:var(--muted)}
.checkbox{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);position:relative;flex:none}
.checkbox.on{border-color:var(--accent);background:var(--accent)}
.checkbox.on::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.moodrow{display:flex;gap:8px;margin-top:14px}
.moodrow button{width:38px;height:38px;border-radius:10px;background:var(--card2);font-size:18px;border:1px solid var(--line)}
.moodrow button.on{background:var(--accent-soft);border-color:var(--accent)}
.reviewtextarea{width:100%;min-height:110px;margin-top:14px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card2);outline:none}
.reviewtextarea:focus{border-color:var(--accent)}

/* ---------- week ---------- */
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin-top:6px}
.wcol{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:140px}
.wcol.today{border-color:var(--accent)}
.wtop{font-size:12px;font-weight:700;margin-bottom:9px;color:var(--muted)}
.wtop .dnum{display:block;color:var(--ink);font-size:16px;margin-top:2px}
.wtop.todaycol .dnum{color:var(--accent)}
.wchip{display:flex;align-items:center;gap:5px;font-size:11px;margin-bottom:6px;padding:5px 6px;border-radius:7px;background:var(--card2);cursor:pointer;color:var(--ink)}
.wchip:hover{outline:1px solid var(--accent)}
.wchip .cdot{width:7px;height:7px;border-radius:2px;flex:none}
.wchip .wname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wchip .st{font-size:10px}
.wempty{color:var(--muted);font-size:11px}

/* ---------- charts mini summary ---------- */
.summarygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.statcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px}
.statcard .v{font-size:20px;font-weight:800}
.statcard .l{font-size:12px;color:var(--muted);margin-top:2px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.on{display:flex}
.modal{background:var(--card);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:100%;max-width:560px;padding:20px;max-height:88vh;overflow:auto}
.modal h3{font-size:16px;margin-bottom:16px}
.modal .mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transition:.25s;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty-badge{display:inline-block;background:var(--card2);color:var(--muted);font-size:11px;padding:2px 8px;border-radius:6px;margin-left:6px}
@media(max-width:720px){ .summarygrid{grid-template-columns:1fr} .weekgrid{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body data-theme="light">
<div class="app">
  <div class="topbar">
    <div class="logo"><span class="dot"></span>PlanLoop</div>
    <nav class="nav" id="nav">
      <button data-view="day">今日</button>
      <button data-view="week">本周</button>
      <button data-view="review">复盘</button>
      <button data-view="templates">模板</button>
    </nav>
    <button class="iconbtn" id="themeBtn" title="切换主题">◐</button>
    <button class="iconbtn" id="exportBtn" title="导出JSON">⇩</button>
  </div>

  <!-- DAY -->
  <section class="view on" id="view-day">
    <div class="datenav" style="justify-content:center;margin:2px 0 4px">
      <button class="datebtn" data-step="-1">‹</button>
      <span class="datelabel" id="dayLabel"></span>
      <button class="datebtn" data-step="1">›</button>
      <button class="todaybtn" id="todayBtn">今天</button>
    </div>
    <div class="dayhead">
      <h2 id="dayTitle">今日</h2>
      <span class="sub" id="daySub"></span>
    </div>
    <div class="summarygrid" id="daySummary"></div>
    <div id="timeline" class="timeline"></div>
    <div class="emptyhint" id="emptyHint" style="display:none">今天没有时间块。去「模板」添加一个固定时间块骨架吧。</div>
    <div class="dayfooter" id="dayFooter">
      <div class="finishrow">
        <button class="bigbtn" id="finishBtn">结束今天 → 去复盘并安排明天</button>
      </div>
    </div>
  </section>

  <!-- WEEK -->
  <section class="view" id="view-week">
    <div style="display:flex;align-items:center;gap:10px;margin:2px 0 10px">
      <button class="datebtn" data-wstep="-7">‹</button>
      <span class="datelabel" id="weekLabel" style="flex:1"></span>
      <button class="datebtn" data-wstep="7">›</button>
      <button class="todaybtn" id="weekToday">本周</button>
    </div>
    <div class="weekgrid" id="weekGrid"></div>
  </section>

  <!-- REVIEW -->
  <section class="view" id="view-review">
    <div class="datenav" style="justify-content:center;margin:2px 0 10px">
      <button class="datebtn" id="revPrev">‹</button>
      <span class="datelabel" id="revLabel"></span>
      <button class="datebtn" id="revNext">›</button>
      <button class="todaybtn" id="revToday">今天</button>
    </div>
    <div class="panel">
      <h3>计划 vs 实际</h3>
      <div class="reviewlist" id="reviewList"></div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap">
        <span style="font-size:12px;color:var(--muted)">今天心情：</span>
        <div class="moodrow" id="moodRow" style="margin-top:0">
          <button data-mood="1">😞</button><button data-mood="2">😕</button><button data-mood="3">😐</button>
          <button data-mood="4">🙂</button><button data-mood="5">😄</button>
        </div>
      </div>
      <textarea class="reviewtextarea" id="reviewText" placeholder="今天的复盘：哪里安排得不好？什么没做成？下次怎么调整？"></textarea>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:12px">
        <button class="btn primary" id="genTomorrow">把打勾的带到明天 →</button>
      </div>
    </div>
  </section>

  <!-- TEMPLATES -->
  <section class="view" id="view-templates">
    <div class="dayhead"><h2>时间块骨架</h2><span class="sub">骨架固定不变，每天往里填内容</span></div>
    <div class="tplgrid" id="tplGrid"></div>
    <button class="addtpl" id="addTpl">+ 新建时间块</button>
  </section>
</div>

<!-- modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">时间块</h3>
    <div class="formgrid">
      <div class="field full"><label>名称</label><input id="f_name" placeholder="如：深度工作"></div>
      <div class="field">
        <label>开始</label>
        <div class="timeinput"><input type="time" id="f_start"></div>
      </div>
      <div class="field">
        <label>结束</label>
        <div class="timeinput"><input type="time" id="f_end"></div>
      </div>
      <div class="field full"><label>颜色</label><div class="swatches" id="swatches"></div></div>
      <div class="field full"><label>重复</label><div class="seg" id="repeatSeg"></div></div>
      <div class="field full" id="dowWrap"><label>选择星期</label><div class="dow" id="dowRow"></div></div>
    </div>
    <div class="mfoot">
      <button class="btn danger" id="delTpl" style="display:none;margin-right:auto">删除</button>
      <button class="btn" id="cancelTpl">取消</button>
      <button class="btn primary" id="saveTpl">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
/* ================= State ================= */
const LS_KEY = 'planloop.v1';
const PALETTE = ['#4f6ef7','#e05d79','#2f9e6e','#c98a1b','#8b5cf6','#0d9488','#db2777','#64748b'];
const DOW_LABEL = ['日','一','二','三','四','五','六'];

const defState = () => ({
  v:1, templates:[], days:{}, settings:{theme:'light'},
  sel:{ day: todayStr(), week: todayStr(), review: todayStr() }
});
let state = load();
function load(){ try{const r=JSON.parse(localStorage.getItem(LS_KEY));return r&&r.v===1?r:defState();}catch(e){return defState();} }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

/* ================= Date helpers ================= */
function todayStr(){ return dstr(new Date()); }
function dstr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseD(s){ return new Date(s+'T12:00:00'); }
function addDays(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return dstr(d); }
function fmtCN(s){ const d=parseD(s); const w=['日','一','二','三','四','五','六'][d.getDay()];
  return `${d.getMonth()+1}月${d.getDate()}日 周${w}`; }

/* ================= Template matching ================= */
function tplApplies(t, dayStr){
  const dow = parseD(dayStr).getDay();
  switch(t.repeat){
    case 'daily': return true;
    case 'weekday': return dow>=1&&dow<=5;
    case 'weekend': return dow===0||dow===6;
    case 'custom': return (t.customDays||[]).includes(dow);
    default: return false;
  }
}
function sortedTemplates(){ return [...state.templates].sort((a,b)=> (a.start||'').localeCompare(b.start||'')); }
function minutesOf(t){ const[a,b]=[t.start.split(':'),t.end.split(':')]; return (+a[0]*60+ +a[1]) - (+b[0]*60+ +b[1]); }

/* ================= Day data ================= */
function defaultBlock(t){ return { taskName:'', note:'', est: minutesOf(t)||0, as:'', ae:'', status:'', anote:'', carry:false }; }
function getDay(dayStr){
  if(!state.days[dayStr]) state.days[dayStr]={blocks:{},review:{text:'',mood:0}};
  const day = state.days[dayStr];
  sortedTemplates().filter(t=>tplApplies(t,dayStr)).forEach(t=>{
    if(!day.blocks[t.id]) day.blocks[t.id]=defaultBlock(t);
  });
  return day;
}

/* ================= Theme ================= */
function applyTheme(t){ document.body.setAttribute('data-theme', t); }
document.getElementById('themeBtn').onclick=()=>{
  state.settings.theme = state.settings.theme==='light'?'dark':'light';
  applyTheme(state.settings.theme); save();
};

/* ================= Navigation ================= */
const VIEWS=['day','week','review','templates'];
let curView='day';
function switchView(v){
  curView=v;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='view-'+v));
  render();
}
document.getElementById('nav').onclick=e=>{ const b=e.target.closest('button'); if(b) switchView(b.dataset.view); };

/* ================= Toast ================= */
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

/* ================= Status cycle ================= */
const STATUS = ['','completed','partial','skipped'];
const STATL = {completed:'完成',partial:'部分完成',skipped:'跳过','':'未开始'};
function setStatus(dayStr, tplId, next){ const b=getDay(dayStr).blocks[tplId]; b.status=next; save(); render(); }

/* ================= RENDER: Day ================= */
function render(){
  if(curView==='day') renderDay();
  else if(curView==='week') renderWeek();
  else if(curView==='review') renderReviewList();
  else renderTemplates();
}

function renderDay(){
  const dayStr = state.sel.day;
  const day = getDay(dayStr);
  document.getElementById('dayTitle').textContent = dayStr===todayStr()?'今日':'此日';
  document.getElementById('dayLabel').textContent = fmtCN(dayStr);
  document.getElementById('daySub').textContent = dayStr===todayStr()?'你现在手上是固定骨架，往里填内容即可':'浏览这一天的计划与执行';
  document.getElementById('dayFooter').style.display = dayStr===todayStr()?'block':'none';

  const tpls = sortedTemplates().filter(t=>tplApplies(t,dayStr));
  const tl = document.getElementById('timeline');
  document.getElementById('emptyHint').style.display = tpls.length?'none':'block';
  tl.innerHTML = '';
  const carryIn = Object.values(day.blocks).filter(b=>b.taskName).length;
  document.getElementById('daySummary').innerHTML = summaryCards(dayStr, tpls, carryIn);

  tpls.forEach(t=>{
    const b = day.blocks[t.id];
    const el = document.createElement('div');
    el.className='block';
    const stLabel = {completed:'完成',partial:'部分',skipped:'跳过','':'未开始'}[b.status];
    el.innerHTML = `
      <div class="bar" style="background:${t.color||PALETTE[0]}"></div>
      <div class="head">
        <span class="tname">${esc(t.name)}</span>
        <span class="time">${t.start}–${t.end}</span>
        <span style="flex:1"></span>
        <span class="statchip" data-tpl="${t.id}"><span class="cd"></span>${stLabel}</span>
        <span class="togglelink" data-exp>详情</span>
      </div>
      <input class="taskin" data-task placeholder="今日要在这个时间块做什么？" value="${esc(b.taskName)}">
      <div class="meta">
        <span>预估 <b>${b.est||'—'}</b> 分钟</span>
        ${b.as?`<span>实际 <b>${b.as}${b.ae?'–'+b.ae:''}</b></span>`:''}
        ${b.anote?`<span title="${esc(b.anote)}">备注</span>`:''}
      </div>
      <div class="detail">
        <div class="grid">
          <div class="field"><label>预估时长(分钟)</label><input type="number" min="0" data-est value="${b.est}"></div>
          <div class="field"><label>状态</label>
            <select data-status>
              ${STATUS.map(s=>`<option value="${s}" ${b.status===s?'selected':''}>${STATL[s]}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>实际开始</label><input type="time" data-as value="${b.as}"></div>
          <div class="field"><label>实际结束</label><input type="time" data-ae value="${b.ae}"></div>
          <div class="field full"><label>备注</label><input data-note value="${esc(b.note)}" placeholder="这项任务的说明"></div>
          <div class="field full"><label>实际备注</label><textarea data-anote placeholder="实际执行情况">${esc(b.anote)}</textarea></div>
        </div>
        <div class="actions">
          <label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer">
            <input type="checkbox" data-carry ${b.carry?'checked':''}> 未完成，带到明天
          </label>
          <button class="btn" data-delinline>清空内容</button>
          <button class="btn primary" data-saveblock>保存</button>
        </div>
      </div>`;
    tl.appendChild(el);
  });
}
function summaryCards(dayStr, tpls){
  const day=getDay(dayStr);
  let done=0; tpls.forEach(t=>{ if(day.blocks[t.id]&&day.blocks[t.id].status==='completed') done++; });
  const filled=Object.values(day.blocks).filter(b=>b.taskName).length;
  return `
    <div class="statcard"><div class="v">${tpls.length}</div><div class="l">时间块</div></div>
    <div class="statcard"><div class="v">${done}/${tpls.length||0}</div><div class="l">已完成</div></div>
    <div class="statcard"><div class="v">${filled}</div><div class="l">已填内容</div></div>`;
}
function refreshDaySummary(dayStr){
  const tpls=sortedTemplates().filter(t=>tplApplies(t,dayStr));
  document.getElementById('daySummary').innerHTML=summaryCards(dayStr,tpls);
}

/* timeline events (delegated) */
document.getElementById('timeline').addEventListener('input', e=>{
  if(e.target.dataset.task){
    const blockEl=e.target.closest('.block'); const id=blockEl.querySelector('.statchip').dataset.tpl;
    getDay(state.sel.day).blocks[id].taskName=e.target.value; save(); refreshDaySummary(state.sel.day);
  }
});
document.getElementById('timeline').addEventListener('click', e=>{
  const blockEl=e.target.closest('.block'); if(!blockEl) return;
  const dayStr=state.sel.day;
  const id=blockEl.querySelector('.statchip').dataset.tpl;
  const b=getDay(dayStr).blocks[id];
  if(e.target.closest('[data-exp]')){ blockEl.classList.toggle('open'); }
  else if(e.target.closest('.statchip')){
    const i=STATUS.indexOf(b.status); b.status=STATUS[(i+1)%STATUS.length]; save(); renderDay();
  }
  else if(e.target.closest('[data-saveblock]')){
    const f=blockEl.querySelector.bind(blockEl);
    b.est=+f('[data-est]').value||0; b.status=f('[data-status]').value; b.as=f('[data-as]').value; b.ae=f('[data-ae]').value;
    b.note=f('[data-note]').value; b.anote=f('[data-anote]').value; b.carry=f('[data-carry]').checked;
    save(); toast('已保存'); renderDay();
  }
  else if(e.target.closest('[data-delinline]')){
    b.taskName='';b.note='';b.est=0;b.as='';b.ae='';b.status='';b.anote='';b.carry=false; save(); toast('已清空'); renderDay();
  }
});

/* finish day → review tomorrow done in review tab, navigate there */
document.getElementById('finishBtn').onclick=()=>{ switchView('review'); };

/* day navigators */
document.addEventListener('click', e=>{
  const nb=e.target.closest('.datebtn[data-step]');
  if(nb && e.target.closest('#view-day')){ state.sel.day=addDays(state.sel.day, +nb.dataset.step); save(); renderDay(); }
});
document.getElementById('todayBtn').onclick=()=>{ state.sel.day=todayStr(); save(); render(); };

/* ================= RENDER: Week ================= */
function renderWeek(){
  const anchor=parseD(state.sel.week);
  const day=anchor.getDay()-1; // monday start
  const monday=parseD(state.sel.week); monday.setDate(anchor.getDate()-((day+7)%7));
  const days=[...Array(7)].map((_,i)=>{ const d=new Date(monday); d.setDate(monday.getDate()+i); return dstr(d); });
  document.getElementById('weekLabel').textContent=`${days[0].slice(5)} ~ ${days[6].slice(5)}`;
  const grid=document.getElementById('weekGrid'); grid.innerHTML='';
  days.forEach(ds=>{
    const day=getDay(ds);
    const tpls=sortedTemplates().filter(t=>tplApplies(t,ds));
    const col=document.createElement('div');
    col.className='wcol'+(ds===todayStr()?' today':'');
    const d=parseD(ds);
    col.innerHTML=`<div class="wtop ${ds===todayStr()?'todaycol':''}">${ds===todayStr()?'今天':'周'+DOW_LABEL[d.getDay()]}<span class="dnum">${d.getDate()}</span></div>`;
    const list=document.createElement('div');
    if(!tpls.length){ list.innerHTML='<div class="wempty">无骨架</div>'; }
    else tpls.forEach(t=>{
      const b=day.blocks[t.id];
      const icon={completed:'●',partial:'◐',skipped:'○','':'·'}[b.status];
      const st={completed:'#2f9e6e',partial:'#c98a1b',skipped:'inherit','':'inherit'}[b.status];
      const chip=document.createElement('div'); chip.className='wchip';
      chip.innerHTML=`<span class="cdot" style="background:${t.color}"></span><span class="wname">${t.name}</span>`;
      const stEl=document.createElement('span'); stEl.className='st'; stEl.style.color=st; stEl.textContent=icon;
      chip.appendChild(stEl);
      chip.title=`${t.name} · ${b.taskName||'(待填写)'}`;
      chip.onclick=()=>{ state.sel.day=ds; switchView('day'); };
      list.appendChild(chip);
    });
    col.appendChild(list);
    grid.appendChild(col);
  });
}
document.addEventListener('click', e=>{
  const wb=e.target.closest('.datebtn[data-wstep]');
  if(wb && e.target.closest('#view-week')){ state.sel.week=addDays(state.sel.week,+wb.dataset.wstep); save(); renderWeek(); }
});
document.getElementById('weekToday').onclick=()=>{ state.sel.week=todayStr(); save(); render(); };

/* ================= RENDER: Review ================= */
function renderReviewList(){
  const dayStr=state.sel.review;
  const day=getDay(dayStr);
  document.getElementById('revLabel').textContent=fmtCN(dayStr);
  const tpls=sortedTemplates().filter(t=>tplApplies(t,dayStr));
  const list=document.getElementById('reviewList'); list.innerHTML='';
  if(!tpls.length){ list.innerHTML='<div class="emptyhint">这一天没有时间块。</div>'; clearReviewMeta(); return; }
  tpls.forEach(t=>{
    const b=day.blocks[t.id];
    const task=b.taskName||'(未填内容)';
    const row=document.createElement('div'); row.className='rrow';
    const stl={completed:'完成',partial:'部分',skipped:'跳过','':'未标'}[b.status];
    const stc={completed:'#2f9e6e',partial:'#c98a1b',skipped:'#9aa3b0','':''}[b.status];
    row.innerHTML=`<span class="cdot" style="background:${t.color||''};width:9px;height:9px;border-radius:3px;flex:none"></span>
      <div class="grow"><div class="task">${esc(task)}</div><div class="tpl">${esc(t.name)} · ${t.start}–${t.end} · 已排 ${b.est||0}min${b.status?' · <b style="color:'+stc+'">'+stl+'</b>':''}</div></div>
      <div class="checkbox ${b.carry?'on':''}" data-carry="${t.id}"></div>`;
    list.appendChild(row);
  });
  // carry toggle
  list.querySelectorAll('[data-carry]').forEach(c=>c.onclick=()=>{ const id=c.dataset.carry; day.blocks[id].carry=!day.blocks[id].carry; save(); renderReviewList(); });
  // mood + text
  const mood=document.getElementById('moodRow'); [...mood.children].forEach(btn=>btn.classList.toggle('on', +btn.dataset.mood===day.review.mood));
  document.getElementById('reviewText').value=day.review.text||'';
}
function clearReviewMeta(){
  [...document.getElementById('moodRow').children].forEach(b=>b.classList.remove('on'));
  document.getElementById('reviewText').value='';
}
document.getElementById('reviewText').addEventListener('input', e=>{
  const day=getDay(state.sel.review); day.review.text=e.target.value; save();
});
document.getElementById('moodRow').onclick=e=>{
  const b=e.target.closest('[data-mood]'); if(!b) return;
  const day=getDay(state.sel.review); day.review.mood=+b.dataset.mood; save();
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on', x===b));
};
document.getElementById('genTomorrow').onclick=()=>{
  const src=getDay(state.sel.review);
  const tm=addDays(state.sel.review,1); const dst=getDay(tm);
  let n=0;
  sortedTemplates().filter(t=>tplApplies(t,state.sel.review)).forEach(t=>{
    const b=src.blocks[t.id];
    if(b.carry && b.taskName){ if(dst.blocks[t.id]){ dst.blocks[t.id].taskName=b.taskName; dst.blocks[t.id].note=b.note; dst.blocks[t.id].est=b.est; } n++; }
  });
  state.sel.day=tm;
  save();
  toast(`已把 ${n} 项带到明天`);
  switchView('day');
};
document.getElementById('revPrev').onclick=()=>{ state.sel.review=addDays(state.sel.review,-1); save(); renderReviewList(); };
document.getElementById('revNext').onclick=()=>{ state.sel.review=addDays(state.sel.review,1); save(); renderReviewList(); };
document.getElementById('revToday').onclick=()=>{ state.sel.review=todayStr(); save(); render(); };

/* ================= RENDER: Templates ================= */
let editingId=null;
function renderTemplates(){
  const grid=document.getElementById('tplGrid'); grid.innerHTML='';
  if(!state.templates.length){ grid.innerHTML='<div class="emptyhint">还没有时间块。点下方「新建时间块」搭建你的每日骨架。</div>'; return; }
  sortedTemplates().forEach(t=>{
    const el=document.createElement('div'); el.className='tpl';
    el.innerHTML=`<span class="sw" style="background:${t.color}"></span>
      <div class="info"><div class="t">${esc(t.name)}</div><div class="s">${t.start}–${t.end} · ${repeatLabel(t)}</div></div>
      <div class="act">
        <button class="mini" data-edit="${t.id}" title="编辑">✎</button>
        <button class="mini" data-deltpl="${t.id}" title="删除">🗑</button>
      </div>`;
    grid.appendChild(el);
  });
}
function repeatLabel(t){
  if(t.repeat==='daily') return '每天';
  if(t.repeat==='weekday') return '工作日';
  if(t.repeat==='weekend') return '周末';
  if(t.repeat==='custom') return '每周 '+(t.customDays||[]).map(d=>DOW_LABEL[d]).join('、');
  return '不重复';
}
document.getElementById('tplGrid').addEventListener('click', e=>{
  const r=e.target.closest('button');
  if(!r) return;
  if(r.dataset.edit) openTemplate(r.dataset.edit);
  else if(r.dataset.deltpl){ if(confirm('删除该时间块？已填的每日计划会保留，但不再出现新的一天。')){ state.templates=state.templates.filter(x=>x.id!==r.dataset.deltpl); save(); renderTemplates(); } }
});
document.getElementById('addTpl').onclick=()=>openTemplate(null);

/* ================= Template modal ================= */
let repeat='daily', customDays=[1,2,3,4,5], color=PALETTE[0];
function renderSwatches(){
  const w=document.getElementById('swatches'); w.innerHTML='';
  PALETTE.forEach(c=>{ const s=document.createElement('span'); s.className='swatch'+(c===color?' on':''); s.style.background=c; s.onclick=()=>{color=c;renderSwatches();}; w.appendChild(s); });
}
function renderRepeatSeg(){
  const seg=document.getElementById('repeatSeg'); seg.innerHTML='';
  [['daily','每天'],['weekday','工作日'],['weekend','周末'],['custom','自定义星期']].forEach(([k,l])=>{
    const b=document.createElement('button'); b.textContent=l; b.classList.toggle('on',repeat===k);
    b.onclick=()=>{repeat=k;renderRepeatSeg();renderDow();}; seg.appendChild(b);
  });
}
function renderDow(){
  const wrap=document.getElementById('dowWrap'); wrap.style.display=repeat==='custom'?'block':'none';
  const row=document.getElementById('dowRow'); row.innerHTML='';
  DOW_LABEL.forEach((l,d)=>{
    const b=document.createElement('button'); b.textContent=l; b.classList.toggle('on',customDays.includes(d));
    b.onclick=()=>{ customDays.includes(d)?customDays=customDays.filter(x=>x!==d):customDays.push(d); renderDow(); }; row.appendChild(b);
  });
}
function openTemplate(id){
  editingId=id;
  const t=id?state.templates.find(x=>x.id===id):null;
  document.getElementById('modalTitle').textContent=t?'编辑时间块':'新建时间块';
  document.getElementById('f_name').value=t?t.name:'';
  document.getElementById('f_start').value=t?t.start:'09:00';
  document.getElementById('f_end').value=t?t.end:'10:30';
  repeat=t?t.repeat:'daily'; customDays=t?[...(t.customDays||[])]:[1,2,3,4,5]; color=t?t.color:PALETTE[0];
  document.getElementById('delTpl').style.display=id?'inline-block':'none';
  renderSwatches(); renderRepeatSeg(); renderDow();
  document.getElementById('overlay').classList.add('on');
}

document.getElementById('cancelTpl').onclick=()=>document.getElementById('overlay').classList.remove('on');
document.getElementById('delTpl').onclick=()=>{
  if(confirm('删除该时间块？')){ state.templates=state.templates.filter(x=>x.id!==editingId); save(); document.getElementById('overlay').classList.remove('on'); renderTemplates(); toast('已删除'); }
};
document.getElementById('saveTpl').onclick=()=>{
  const name=document.getElementById('f_name').value.trim();
  const start=document.getElementById('f_start').value, end=document.getElementById('f_end').value;
  if(!name||!start||!end){ toast('请填写名称和起止时间'); return; }
  const data={ id:editingId||uid(), name, start, end, color,
    repeat: repeat==='custom'?'custom':repeat, customDays: repeat==='custom'?customDays:[], createdAt:Date.now() };
  if(editingId){ const i=state.templates.findIndex(x=>x.id===editingId); state.templates[i]=data; }
  else state.templates.push(data);
  save(); document.getElementById('overlay').classList.remove('on'); renderTemplates(); toast(editingId?'已更新':'已创建');
  state.sel.day=todayStr();
};

/* ================= export ================= */
document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='planloop-'+(todayStr())+'.json'; a.click();
  toast('已导出 JSON');
};

/* ================= misc ================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* seed sample skeleton on first run */
if(!state.templates.length){
  state.templates=[
    {id:uid(),name:'黄金深度工作',start:'10:00',end:'12:00',color:'#4f6ef7',repeat:'weekday',customDays:[],createdAt:Date.now()},
    {id:uid(),name:'午间整备',start:'13:30',end:'14:00',color:'#8b5cf6',repeat:'weekday',customDays:[],createdAt:Date.now()},
    {id:uid(),name:'下午推进',start:'14:30',end:'17:00',color:'#0d9488',repeat:'weekday',customDays:[],createdAt:Date.now()},
    {id:uid(),name:'健身',start:'17:30',end:'18:30',color:'#2f9e6e',repeat:'custom',customDays:[1,3,5],createdAt:Date.now()},
  ];
  save(); state.sel={day:todayStr(),week:todayStr(),review:todayStr()}; save();
}

applyTheme(state.settings.theme||'light');
render();
})();
</script>
</body>
</html>
